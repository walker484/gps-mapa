
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central GPS</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    header {
      padding: 15px;
      background: #0d1b2a;
      text-align: center;
    }

    h2 {
      margin: 0;
    }

    #status {
      margin-top: 8px;
      font-weight: bold;
    }

    .painel {
      padding: 12px;
      background: #10243a;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card {
      background: #172f49;
      padding: 10px;
      border-radius: 8px;
    }

    .valor {
      margin-top: 5px;
      font-weight: bold;
      color: #5ee7ff;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #1683ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #map {
      height: 55vh;
      width: 100%;
    }

    .erro {
      color: #ff7070;
    }

    .ok {
      color: #63ff8a;
    }
  </style>
</head>

<body>

<header>
  <h2>📍 Central GPS</h2>
  <div id="status">⏳ Iniciando GPS...</div>
</header>

<div class="painel">

  <div class="info">

    <div class="card">
      Latitude
      <div class="valor" id="latitude">---</div>
    </div>

    <div class="card">
      Longitude
      <div class="valor" id="longitude">---</div>
    </div>

    <div class="card">
      Precisão
      <div class="valor" id="precisao">---</div>
    </div>

    <div class="card">
      Velocidade
      <div class="valor" id="velocidade">---</div>
    </div>

    <div class="card">
      Atualização
      <div class="valor" id="atualizacao">---</div>
    </div>

    <div class="card">
      GPS
      <div class="valor" id="gps">---</div>
    </div>

  </div>

  <button onclick="iniciarGPS()">
    📍 TESTAR GPS NOVAMENTE
  </button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  let mapa;
  let marcador = null;
  let circulo = null;
  let watchID = null;

  function iniciarMapa() {

    mapa = L.map("map").setView([-19.9167, -43.9345], 13);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }
    ).addTo(mapa);
  }

  function atualizarTela(posicao) {

    const lat = posicao.coords.latitude;
    const lon = posicao.coords.longitude;
    const precisao = posicao.coords.accuracy;

    let velocidade = posicao.coords.speed;

    if (
      velocidade === null ||
      velocidade === undefined ||
      isNaN(velocidade)
    ) {
      velocidade = 0;
    } else {
      velocidade = velocidade * 3.6;
    }

    document.getElementById("latitude").textContent =
      lat.toFixed(6);

    document.getElementById("longitude").textContent =
      lon.toFixed(6);

    document.getElementById("precisao").textContent =
      precisao.toFixed(1) + " metros";

    document.getElementById("velocidade").textContent =
      velocidade.toFixed(1) + " km/h";

    document.getElementById("atualizacao").textContent =
      new Date().toLocaleTimeString();

    document.getElementById("gps").textContent =
      "🟢 LOCALIZAÇÃO RECEBIDA";

    document.getElementById("gps").className =
      "valor ok";

    document.getElementById("status").textContent =
      "🟢 GPS FUNCIONANDO";

    document.getElementById("status").className =
      "ok";

    if (!marcador) {

      marcador = L.marker([lat, lon])
        .addTo(mapa)
        .bindPopup("📍 Localização atual")
        .openPopup();

    } else {

      marcador.setLatLng([lat, lon]);

    }

    if (!circulo) {

      circulo = L.circle(
        [lat, lon],
        {
          radius: precisao
        }
      ).addTo(mapa);

    } else {

      circulo.setLatLng([lat, lon]);
      circulo.setRadius(precisao);

    }

    mapa.setView([lat, lon], 17);
  }

  function erroGPS(erro) {

    document.getElementById("gps").className =
      "valor erro";

    if (erro.code === 1) {

      document.getElementById("gps").textContent =
        "🔴 PERMISSÃO NEGADA";

      document.getElementById("status").textContent =
        "🔴 Permita o acesso à localização";

    } else if (erro.code === 2) {

      document.getElementById("gps").textContent =
        "🔴 LOCALIZAÇÃO INDISPONÍVEL";

      document.getElementById("status").textContent =
        "🔴 GPS não encontrado";

    } else if (erro.code === 3) {

      document.getElementById("gps").textContent =
        "🔴 TEMPO ESGOTADO";

      document.getElementById("status").textContent =
        "🔴 GPS demorou para responder";

    } else {

      document.getElementById("gps").textContent =
        "🔴 ERRO";

      document.getElementById("status").textContent =
        "🔴 Erro desconhecido";
    }

    console.log(erro);
  }

  function iniciarGPS() {

    if (!navigator.geolocation) {

      document.getElementById("status").textContent =
        "🔴 Este navegador não suporta GPS";

      return;
    }

    document.getElementById("status").textContent =
      "🛰️ Procurando localização...";

    document.getElementById("gps").textContent =
      "⏳ Aguardando GPS...";

    if (watchID !== null) {

      navigator.geolocation.clearWatch(watchID);

    }

    watchID = navigator.geolocation.watchPosition(
      atualizarTela,
      erroGPS,
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 30000
      }
    );
  }

  iniciarMapa();
  iniciarGPS();

</script>

</body>
</html>
